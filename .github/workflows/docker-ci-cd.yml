name: DANGOL AI - Docker CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    name: Build backend and deploy to Render
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: vars
        run: echo "image_prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push merged backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.render
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/backend-all:latest
            ${{ steps.vars.outputs.image_prefix }}/backend-all:${{ github.sha }}

      - name: Deploy backend to Render
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_HOOK }}
        run: |
          if [ -z "$BACKEND_HOOK" ]; then
            echo "ERROR: GitHub Secret RENDER_BACKEND_HOOK खाली छ वा बनेको छैन"
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$BACKEND_HOOK"