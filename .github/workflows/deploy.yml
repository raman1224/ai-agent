
name: DANGOL AI - Docker CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:

  # ==============================
  # BUILD AND PUSH DOCKER IMAGES
  # ==============================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: vars
        run: |
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image_prefix=$IMAGE_PREFIX" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gateway
      - name: Build Gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/gateway/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/gateway:latest
            ${{ steps.vars.outputs.image_prefix }}/gateway:${{ github.sha }}

      # Auth
      - name: Build Auth
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/auth/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/auth:latest
            ${{ steps.vars.outputs.image_prefix }}/auth:${{ github.sha }}

      # Chat
      - name: Build Chat
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/chat/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/chat:latest
            ${{ steps.vars.outputs.image_prefix }}/chat:${{ github.sha }}

      # Agent
      - name: Build AI Agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/services/agent/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/agent:latest
            ${{ steps.vars.outputs.image_prefix }}/agent:${{ github.sha }}

      # Frontend
      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ steps.vars.outputs.image_prefix }}/frontend:latest
            ${{ steps.vars.outputs.image_prefix }}/frontend:${{ github.sha }}


  # ==============================
  # DEPLOY TO VPS
  # ==============================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.2

        env:
          IMAGE_PREFIX: ${{ needs.build.outputs.image_prefix }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_PREFIX,GHCR_USERNAME,GHCR_TOKEN

          script: |
            set -e

            cd /opt/dangol-ai

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" --password-stdin

            docker compose pull

            docker compose up -d --remove-orphans

            docker image prune -f

            echo "DANGOL AI deployed successfully!"
