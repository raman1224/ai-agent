services:

  # FRONTEND
  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG:-latest}
    container_name: dangol-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

    expose:
      - "3000"

    depends_on:
      - gateway

    networks:
      - dangol-network


  # API GATEWAY
  gateway:
    image: ${IMAGE_PREFIX}/gateway:${IMAGE_TAG:-latest}
    container_name: dangol-gateway
    restart: unless-stopped

    env_file:
      - ./env/gateway.env

    environment:
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL}
      REDIS_URL: redis://redis:6379

      AUTH_SERVICE: http://auth:8001
      CHAT_SERVICE: http://chat:8002
      AGENT_SERVICE: http://agent:8003

    expose:
      - "8000"

    depends_on:
      - auth
      - chat
      - agent
      - redis

    networks:
      - dangol-network


  # AUTH SERVICE
  auth:
    image: ${IMAGE_PREFIX}/auth:${IMAGE_TAG:-latest}
    container_name: dangol-auth
    restart: unless-stopped

    env_file:
      - ./env/auth.env

    environment:
      NODE_ENV: production
      PORT: 8001
      REDIS_URL: redis://redis:6379

    expose:
      - "8001"

    depends_on:
      - redis

    networks:
      - dangol-network


  # CHAT SERVICE
  chat:
    image: ${IMAGE_PREFIX}/chat:${IMAGE_TAG:-latest}
    container_name: dangol-chat
    restart: unless-stopped

    env_file:
      - ./env/chat.env

    environment:
      NODE_ENV: production
      PORT: 8002
      REDIS_URL: redis://redis:6379

    expose:
      - "8002"

    depends_on:
      - redis

    networks:
      - dangol-network


  # AI AGENT
  agent:
    image: ${IMAGE_PREFIX}/agent:${IMAGE_TAG:-latest}
    container_name: dangol-agent
    restart: unless-stopped

    env_file:
      - ./env/agent.env

    environment:
      NODE_ENV: production
      PORT: 8003
      REDIS_URL: redis://redis:6379

    expose:
      - "8003"

    depends_on:
      - redis

    networks:
      - dangol-network


  # REDIS
  redis:
    image: redis:7-alpine
    container_name: dangol-redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis-data:/data

    expose:
      - "6379"

    networks:
      - dangol-network


  # NGINX
  nginx:
    image: nginx:alpine
    container_name: dangol-nginx
    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - frontend
      - gateway

    networks:
      - dangol-network


networks:
  dangol-network:
    driver: bridge


volumes:
  redis-data:
